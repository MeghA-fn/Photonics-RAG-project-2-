
name: Photonics RAG CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  docker-build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest

      - name: Run API tests
        run: |
          python -m pytest tests/ -v

      - name: Verify RAG artifacts
        run: |
          test -f data/processed/chunks.csv
          test -f data/chroma_db/chroma.sqlite3
          test -d data/chroma_db
          echo "RAG artifacts found"
          ls -lh data/processed/chunks.csv
          ls -lh data/chroma_db/

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build API Docker image
        run: |
          docker build \
            -f Dockerfile \
            -t photonicsrag-api:ci .

      - name: Build Streamlit UI Docker image
        run: |
          docker build \
            -f Dockerfile.ui \
            -t photonicsrag-ui:ci .
